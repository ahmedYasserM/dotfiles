# ~/.config/fuzzel/fuzzel.ini

[main]
font=JetBrainsMono Nerd Font:size=11
prompt="❯ "
icon-theme=Papirus-Dark
icons-enabled=yes
show-actions=yes
terminal=foot

# Layout & Window sizing
lines=10
width=60
tabs=4
horizontal-pad=24
vertical-pad=16
inner-pad=12

# Center it nicely
layer=overlay
anchor=center

[colors]
# Background is dark blue with ~80% transparency (cc)
background=1a1b26ff
text=a9b1d6ff
match=ff9e64ff
selection=2f3549ff
selection-text=c0caf5ff
selection-match=ff9e64ff
border=7aa2f7ff

[border]
width=2
radius=12

[key-bindings]
next=Mod1+j Down
prev=Mod1+k Up
